name: stampit_app
description: "StampIt staff app: scan and redeem coupons on the go."
publish_to: 'none'

version: 1.0.2+5

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  # Was pinned exact to 7.0.1 (not ^7.0.0) because every release from 7.1.0
  # onward requires compileSdk 36, above what the project supported at the
  # time. Unpinned now that android/app/build.gradle.kts hardcodes
  # compileSdk/targetSdk to 36 — no longer a constraint.
  mobile_scanner: ^7.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#faf3e6"
    theme_color: "#f2a900"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
